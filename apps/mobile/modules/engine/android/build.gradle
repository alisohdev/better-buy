plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'expo.modules.betterbuyengine'
version = '0.1.0'
android {
  namespace 'expo.modules.betterbuyengine'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}
def engineArtifacts = file('libs')
rootProject.allprojects { repositories { flatDir { dirs engineArtifacts } } }
dependencies { implementation(name: 'betterbuyengine', ext: 'aar') }
